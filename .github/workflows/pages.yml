name: showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - name: Install application and verification tools
        run: python -m pip install ".[dev,similarity]"
      - name: Check Python implementation
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Download official COCO data and verify expected findings
        run: python scripts/verify_public_datasets.py --download --output reports/public-verification
      - name: Fetch pinned benchmark comparison files
        run: python scripts/fetch_similarity_examples.py
      - name: Build the source-backed showcase
        run: python scripts/build_showcase.py --output reports/showcase --github-url "https://github.com/${{ github.repository }}"
      - name: Install showcase test tools
        working-directory: showcase
        run: npm ci
      - name: Check showcase interactions and original image fingerprints
        working-directory: showcase
        run: npm test
      - name: Build optional source-link export
        run: python scripts/export_source_links.py --source reports/showcase --output reports/showcase-public
      - name: Verify the optional source-link export
        working-directory: showcase
        run: npm run test:publication
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the generated public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/showcase
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified showcase
        id: deployment
        uses: actions/deploy-pages@v4
