name: Feature request
description: Propose a concrete improvement to dataset auditing.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem would this solve?
      description: Describe a real dataset workflow and the decision it would improve.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and evidence
      description: Explain expected inputs, outputs and how success could be verified.
    validations:
      required: true
